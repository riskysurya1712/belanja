<!-- ================= PESANAN ================= -->

<div class="card">

<h2>🚚 Manajemen Status Pesanan</h2>

<div id="orderList"></div>

</div>


<script>

/* =====================================================
   RENDER PESANAN
===================================================== */

function renderOrders(){

    const container =
        document.getElementById("orderList");

    const orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );


    if(orders.length === 0){

        container.innerHTML = `
            <div class="empty">
                Belum ada pesanan dari customer.
            </div>
        `;

        return;
    }


    container.innerHTML =
    orders.map(order => `

        <div class="order">

            <h3>
                📦 ${order.productName}
            </h3>

            <p>
                <b>Customer:</b>
                ${order.customer}
            </p>

            <p>
                <b>Harga:</b>
                ${rupiah(order.price)}
            </p>

            <p>
                <b>Tanggal:</b>
                ${order.date}
            </p>


            <!-- STATUS PESANAN -->

            <p style="margin-top:12px">
                <b>Status Pesanan:</b>
            </p>


            <select
                onchange="changeStatus(${order.id},this.value)">

                <option
                    value="Belum Dibayar"
                    ${order.status === "Belum Dibayar" ? "selected" : ""}>
                    💰 Belum Dibayar
                </option>

                <option
                    value="Sudah Dibayar"
                    ${order.status === "Sudah Dibayar" ? "selected" : ""}>
                    ✅ Sudah Dibayar
                </option>

                <option
                    value="Sedang Dikemas"
                    ${order.status === "Sedang Dikemas" ? "selected" : ""}>
                    📦 Sedang Dikemas
                </option>

                <option
                    value="Sudah Dikirim"
                    ${order.status === "Sudah Dikirim" ? "selected" : ""}>
                    🚚 Sudah Dikirim
                </option>

            </select>


            <!-- STATUS SAAT INI -->

            <p style="margin-top:12px">

                Status saat ini:

                <span class="status">
                    ${getStatusIcon(order.status)}
                    ${order.status || "Belum Dibayar"}
                </span>

            </p>

        </div>

    `).join("");

}


/* =====================================================
   ICON STATUS
===================================================== */

function getStatusIcon(status){

    switch(status){

        case "Sudah Dibayar":
            return "✅";

        case "Sedang Dikemas":
            return "📦";

        case "Sudah Dikirim":
            return "🚚";

        default:
            return "💰";

    }

}


/* =====================================================
   UBAH STATUS PESANAN
===================================================== */

function changeStatus(id,status){

    let orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );


    const order =
        orders.find(
            o => o.id === id
        );


    if(!order){
        return;
    }


    order.status = status;


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    renderOrders();

}

</script>
