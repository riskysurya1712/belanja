<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - GadgetStore Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef8ff;
    color:#172033;
}

header{
    background:linear-gradient(
        135deg,
        #06182c,
        #075da8,
        #5ed5ff
    );

    color:white;
    padding:25px;
    text-align:center;

    box-shadow:0 5px 20px #0002;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:7px;
    opacity:.9;
}

.container{
    width:92%;
    max-width:1250px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;

    border:1px solid #d8edff;

    box-shadow:
        0 8px 25px #0878c522;
}

h2{
    color:#075da8;
    margin-bottom:20px;
}

/* ================= INPUT ================= */

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    margin:7px 0 15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#0878d1;
}

textarea{
    min-height:100px;
    resize:vertical;
}

/* ================= BUTTON ================= */

button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#0878d1;
    margin:3px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.success{ background:#08a66a; }
.delete{ background:#ef4444; }
.edit{ background:#f59e0b; }
.back{ background:#475569; }

/* ================= TOPBAR ================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* ================= PRODUCT ================= */

.product-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap:20px;
}

.product{
    border:1px solid #d9ecfa;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.product-body{
    padding:16px;
}

.price{
    color:#0878d1;
    font-size:20px;
    font-weight:bold;
    margin:8px 0 4px;
}

.stock-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
    background:#e0f2fe;
    color:#0369a1;
}

.stock-badge.out-of-stock{
    background:#fee2e2;
    color:#b91c1c;
}

.product-desc{
    color:#64748b;
    line-height:1.5;
}

.product video{
    width:100%;
    margin-top:12px;
    border-radius:8px;
    background:#000;
}

/* ================= ORDERS & STATUS ================= */

.order{
    border:1px solid #dcebf5;
    border-radius:15px;
    padding:18px;
    margin:12px 0;
    background:#fbfdff;
}

.status{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.status-unpaid{ background:#fff7ed; color:#c2410c; }
.status-paid{ background:#dcfce7; color:#15803d; }
.status-packing{ background:#dbeafe; color:#1d4ed8; }
.status-shipped{ background:#ede9fe; color:#6d28d9; }

.tracking{ display:flex; align-items:center; margin:20px 0; }
.step{ text-align:center; min-width:80px; color:#94a3b8; }
.circle{ width:40px; height:40px; margin:auto; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; }
.step.active{ color:#0878d1; font-weight:bold; }
.step.active .circle{ background:#0878d1; color:white; }
.step.done{ color:#08a66a; font-weight:bold; }
.step.done .circle{ background:#08a66a; color:white; }
.line{ height:4px; background:#e2e8f0; flex:1; max-width:80px; }
.line.done{ background:#08a66a; }
.step small{ display:block; margin-top:6px; font-size:10px; }

.empty{ text-align:center; padding:30px; color:#64748b; }
.hidden{ display:none!important; }

/* ================= UPLOAD ================= */

.upload-box{
    border:2px dashed #9bd5f5;
    background:#f4fbff;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
}

.preview{
    display:none;
    margin-top:10px;
    max-width:250px;
    max-height:180px;
    border-radius:10px;
}

.file-name{ margin-top:8px; color:#64748b; font-size:13px; }
.loading-text{ color:#0878d1; font-weight:bold; margin-top:10px; display:none; }

footer{ text-align:center; padding:25px; color:#64748b; }

</style>

</head>


<body>

<header>
    <h1>GadgetStore Management System</h1>
    <p>Administrator Dashboard</p>
</header>

<div class="container">

<div class="card">
    <div class="topbar">
        <div>
            <h2>⚙️ Panel Administrator</h2>
            <p>Login sebagai: <b id="adminName">admin</b></p>
        </div>
        <div>
            <button class="back" onclick="location.href='index.html'">🛍️ Halaman Customer</button>
            <button class="delete" onclick="logout()">Keluar</button>
        </div>
    </div>
</div>

<!-- FORM PRODUK -->
<div class="card">
    <h2 id="formTitle">➕ Tambah Produk Baru</h2>

    <form id="productForm">
        <label>Nama Produk</label>
        <input type="text" id="productName" placeholder="Contoh: Smartphone Galaxy Ultra" required>

        <label>Harga Produk (Rp)</label>
        <input type="number" id="productPrice" placeholder="Contoh: 12000000" min="0" required>

        <label>Stok Barang</label>
        <input type="number" id="productStock" placeholder="Contoh: 15" min="0" required>

        <label>Deskripsi Produk</label>
        <textarea id="productDesc" placeholder="Masukkan spesifikasi produk..." required></textarea>

        <!-- UPLOAD FOTO -->
        <div class="upload-box">
            <label>📷 Upload Foto Produk (Ukuran Besar Otomatis Dikompres)</label>
            <input type="file" id="productImage" accept="image/*">
            <div id="imageName" class="file-name"></div>
            <img id="imagePreview" class="preview">
        </div>

        <!-- UPLOAD VIDEO -->
        <div class="upload-box">
            <label>🎬 Upload Video Produk (Mendukung File Besar HD)</label>
            <input type="file" id="productVideo" accept="video/*">
            <div id="videoName" class="file-name"></div>
            <video id="videoPreview" class="preview" controls></video>
        </div>

        <div id="loadingStatus" class="loading-text">⏳ Memproses & Menyimpan Media... Mohon tunggu sebentar.</div>

        <button type="submit" id="btnSave" class="success">💾 Simpan Produk</button>
        <button type="button" class="back hidden" id="cancelEdit" onclick="cancelEdit()">Batal Edit</button>
    </form>
</div>

<!-- DAFTAR PRODUK -->
<div class="card">
    <h2>📦 Manajemen Produk</h2>
    <div id="productList" class="product-grid"></div>
</div>

<!-- PESANAN -->
<div class="card">
    <h2>🚚 Manajemen Status Pesanan</h2>
    <div id="orderList"></div>
</div>

</div>

<footer>© 2026 GadgetStore Pro — Administrator</footer>

<script>

/* =====================================================
INDEXED DB SETUP (Menampung File Besar Hingga Ratusan MB)
===================================================== */
let db;
const request = indexedDB.open("GadgetStoreLargeDB", 1);

request.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains("products")) {
        db.createObjectStore("products", { keyPath: "id" });
    }
};

request.onsuccess = function(e) {
    db = e.target.result;
    renderProducts();
    renderOrders();
};

request.onerror = function() {
    alert("Database browser gagal diakses!");
};

/* =====================================================
KOMPRESI GAMBAR OTOMATIS
===================================================== */
function compressImage(file, maxWidth = 1000, quality = 0.7) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement("canvas");
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", quality));
            };
        };
    });
}

/* =====================================================
BACA FILE BESAR (BLOB / BASE64)
===================================================== */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function rupiah(number) {
    return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(number);
}

let editingId = null;

/* =====================================================
PREVIEW FILE
===================================================== */
document.getElementById("productImage").addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;
    document.getElementById("imageName").textContent = file.name + " (" + (file.size / (1024*1024)).toFixed(2) + " MB)";
    const preview = document.getElementById("imagePreview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});

document.getElementById("productVideo").addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;
    document.getElementById("videoName").textContent = file.name + " (" + (file.size / (1024*1024)).toFixed(2) + " MB)";
    const preview = document.getElementById("videoPreview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});

/* =====================================================
SUBMIT PRODUK
===================================================== */
document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const btnSave = document.getElementById("btnSave");
    const loadingStatus = document.getElementById("loadingStatus");
    
    btnSave.disabled = true;
    loadingStatus.style.display = "block";

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const stock = Number(document.getElementById("productStock").value);
    const desc = document.getElementById("productDesc").value.trim();
    const imageFile = document.getElementById("productImage").files[0];
    const videoFile = document.getElementById("productVideo").files[0];

    try {
        if (editingId) {
            const tx = db.transaction("products", "readwrite");
            const store = tx.objectStore("products");

            store.get(editingId).onsuccess = async function(e) {
                const oldProduct = e.target.result;
                let image = oldProduct ? oldProduct.image : "";
                let video = oldProduct ? oldProduct.video : "";

                if (imageFile) image = await compressImage(imageFile);
                if (videoFile) video = await fileToBase64(videoFile);

                const updatedProduct = { id: editingId, name, price, stock, desc, image, video };
                
                const updateTx = db.transaction("products", "readwrite");
                updateTx.objectStore("products").put(updatedProduct);

                updateTx.oncomplete = function() {
                    alert("Produk berhasil diperbarui!");
                    finishSubmit();
                };
            };
        } else {
            let image = "";
            let video = "";

            if (imageFile) {
                image = await compressImage(imageFile);
            }
            if (videoFile) {
                video = await fileToBase64(videoFile);
            }

            const product = { id: Date.now(), name, price, stock, desc, image, video };

            const addTx = db.transaction("products", "readwrite");
            addTx.objectStore("products").add(product);

            addTx.oncomplete = function() {
                alert("Produk berhasil ditambahkan!");
                finishSubmit();
            };

            addTx.onerror = function() {
                alert("Gagal menyimpan ke memori lokal. Ukuran file terlalu ekstrem!");
                btnSave.disabled = false;
                loadingStatus.style.display = "none";
            };
        }
    } catch (err) {
        alert("Terjadi kesalahan saat memproses media.");
        btnSave.disabled = false;
        loadingStatus.style.display = "none";
    }
});

function finishSubmit() {
    document.getElementById("btnSave").disabled = false;
    document.getElementById("loadingStatus").style.display = "none";
    resetForm();
    renderProducts();
}

function resetForm() {
    editingId = null;
    document.getElementById("productForm").reset();
    document.getElementById("cancelEdit").classList.add("hidden");
    document.getElementById("formTitle").textContent = "➕ Tambah Produk Baru";
    document.getElementById("imagePreview").style.display = "none";
    document.getElementById("videoPreview").style.display = "none";
    document.getElementById("imageName").textContent = "";
    document.getElementById("videoName").textContent = "";
}

function cancelEdit() {
    resetForm();
}

/* =====================================================
RENDER PRODUK
===================================================== */
function renderProducts() {
    if (!db) return;
    const container = document.getElementById("productList");
    const tx = db.transaction("products", "readonly");
    const store = tx.objectStore("products");
    const request = store.getAll();

    request.onsuccess = function() {
        const products = request.result || [];

        if (products.length === 0) {
            container.innerHTML = `<div class="empty">📦 Belum ada produk.</div>`;
            return;
        }

        container.innerHTML = products.map(product => `
            <div class="product">
                <img src="${product.image || 'https://via.placeholder.com/600x400?text=No+Image'}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
                <div class="product-body">
                    <h3>${product.name}</h3>
                    <div class="price">${rupiah(product.price)}</div>
                    <div class="stock-badge ${product.stock <= 0 ? 'out-of-stock' : ''}">
                        ${product.stock > 0 ? 'Stok: ' + product.stock : 'Stok Habis'}
                    </div>
                    <p class="product-desc">${product.desc}</p>
                    ${product.video ? `<video controls><source src="${product.video}">Browser tidak mendukung video.</video>` : ''}
                    <br><br>
                    <button class="edit" onclick="editProduct(${product.id})">✏️ Edit</button>
                    <button class="delete" onclick="deleteProduct(${product.id})">🗑️ Hapus</button>
                </div>
            </div>
        `).join("");
    };
}

/* =====================================================
EDIT & DELETE PRODUK
===================================================== */
function editProduct(id) {
    const tx = db.transaction("products", "readonly");
    const store = tx.objectStore("products");
    
    store.get(id).onsuccess = function(e) {
        const product = e.target.result;
        if (!product) return;

        document.getElementById("productName").value = product.name;
        document.getElementById("productPrice").value = product.price;
        document.getElementById("productStock").value = product.stock || 0;
        document.getElementById("productDesc").value = product.desc;

        editingId = id;
        document.getElementById("cancelEdit").classList.remove("hidden");
        document.getElementById("formTitle").textContent = "✏️ Edit Produk";
        window.scrollTo({ top: 0, behavior: "smooth" });
    };
}

function deleteProduct(id) {
    if (!confirm("Yakin ingin menghapus produk ini?")) return;
    const tx = db.transaction("products", "readwrite");
    tx.objectStore("products").delete(id);
    tx.oncomplete = function() {
        renderProducts();
    };
}

/* =====================================================
PESANAN / ORDERS
===================================================== */
const statuses = ["Belum Dibayar", "Sudah Dibayar", "Sedang Dikemas", "Sudah Dikirim"];

function statusClass(status) {
    if (status === "Sudah Dibayar") return "status-paid";
    if (status === "Sedang Dikemas") return "status-packing";
    if (status === "Sudah Dikirim") return "status-shipped";
    return "status-unpaid";
}

function statusNumber(status) {
    const list = { "Belum Dibayar": 1, "Sudah Dibayar": 2, "Sedang Dikemas": 3, "Sudah Dikirim": 4 };
    return list[status] || 1;
}

function renderOrders() {
    const container = document.getElementById("orderList");
    const orders = JSON.parse(localStorage.getItem("orders") || "[]");

    if (orders.length === 0) {
        container.innerHTML = `<div class="empty">📦 Belum ada pesanan dari customer.</div>`;
        return;
    }

    container.innerHTML = orders.slice().reverse().map(order => {
        const current = statusNumber(order.status);
        return `
        <div class="order">
            <h3>📦 ${order.productName}</h3>
            <p><b>Customer:</b> ${order.customer}</p>
            <p><b>Jumlah:</b> ${order.quantity || 1}</p>
            <p><b>Harga:</b> ${rupiah(order.price)}</p>
            <p><b>Total:</b> ${rupiah(order.total || order.price)}</p>
            <p><b>Pembayaran:</b> ${order.payment || "-"}</p>
            <p><b>Tanggal:</b> ${order.date}</p>
            <p style="margin-top:12px">
                Status saat ini:
                <span class="status ${statusClass(order.status)}">${getIcon(order.status)} ${order.status}</span>
            </p>
            <div class="tracking">
                <div class="step ${stepClass(current, 1)}"><div class="circle">💰</div><small>Belum<br>Dibayar</small></div>
                <div class="line ${lineClass(current, 2)}"></div>
                <div class="step ${stepClass(current, 2)}"><div class="circle">✅</div><small>Sudah<br>Dibayar</small></div>
                <div class="line ${lineClass(current, 3)}"></div>
                <div class="step ${stepClass(current, 3)}"><div class="circle">📦</div><small>Sedang<br>Dikemas</small></div>
                <div class="line ${lineClass(current, 4)}"></div>
                <div class="step ${stepClass(current, 4)}"><div class="circle">🚚</div><small>Sudah<br>Dikirim</small></div>
            </div>
            <label><b>Ubah Status Pesanan:</b></label>
            <select onchange="changeStatus(${order.id}, this.value)">
                ${statuses.map(s => `<option value="${s}" ${order.status === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
        </div>`;
    }).join("");
}

function stepClass(current, step) {
    if (step < current) return "done";
    if (step === current) return "active";
    return "";
}

function lineClass(current, step) {
    return current >= step ? "done" : "";
}

function getIcon(status) {
    if (status === "Sudah Dibayar") return "✅";
    if (status === "Sedang Dikemas") return "📦";
    if (status === "Sudah Dikirim") return "🚚";
    return "💰";
}

function changeStatus(id, status) {
    let orders = JSON.parse(localStorage.getItem("orders") || "[]");
    const order = orders.find(o => o.id === id);
    if (!order) return;
    order.status = status;
    localStorage.setItem("orders", JSON.stringify(orders));
    renderOrders();
    alert("Status pesanan berhasil diubah menjadi:\n\n" + status);
}

function logout() {
    localStorage.removeItem("loggedUser");
    localStorage.removeItem("loggedRole");
    location.href = "index.html";
}

</script>

</body>
</html>
