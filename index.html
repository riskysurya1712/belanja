<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetStore Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef8ff;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#071b33,#0b63ce,#72d7ff);
    color:white;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 20px #0002;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:7px;
    opacity:.9;
}

.container{
    width:92%;
    max-width:1200px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 8px 25px #0878c522;
    border:1px solid #d7edff;
}

/* LOGIN */
#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#06182c,#0878d1,#9be9ff);
}

.login-box{
    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:25px;
    box-shadow:0 20px 50px #0005;
}

.login-box h2{
    text-align:center;
    color:#0967bd;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#718096;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    margin:7px 0 15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#0785e8;
}

button,.btn{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#0878d1;
    color:white;
    transition:.2s;
}

button:hover,.btn:hover{
    transform:translateY(-2px);
    background:#075ca2;
}

.admin-btn{
    background:#152238;
}

.logout{
    background:#ef4444;
}

.info{
    background:#e8f6ff;
    padding:12px;
    border-radius:10px;
    font-size:14px;
    margin-top:10px;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.user-info{
    display:flex;
    align-items:center;
    gap:10px;
}

/* KATALOG */
.section-title{
    margin-bottom:18px;
    color:#075da8;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.product{
    border:1px solid #d9ecfa;
    border-radius:18px;
    overflow:hidden;
    background:white;
    box-shadow:0 5px 18px #0878d11c;
}

.product img{
    width:100%;
    height:210px;
    object-fit:cover;
}

.product-body{
    padding:18px;
}

.product h3{
    margin-bottom:8px;
}

.price{
    color:#0878d1;
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.desc{
    color:#64748b;
    line-height:1.5;
    min-height:50px;
}

video{
    width:100%;
    margin-top:15px;
    border-radius:10px;
    background:#000;
}

.buy{
    display:block;
    text-align:center;
    text-decoration:none;
    margin-top:15px;
    background:#08a66a;
}

.buy:hover{
    background:#078c5b;
}

/* PESANAN */
.order{
    border:1px solid #dcebf5;
    padding:15px;
    border-radius:12px;
    margin:10px 0;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#e0f2fe;
    color:#0369a1;
    font-size:13px;
    font-weight:bold;
    margin-top:8px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.hidden{
    display:none!important;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">

<div class="login-box">
    <h2>GadgetStore Pro</h2>
    <p>Login ke GadgetStore Management System</p>

    <label>Login sebagai</label>
    <select id="role">
        <option value="customer">Customer</option>
        <option value="admin">Administrator</option>
    </select>

    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username">

    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password">

    <button onclick="login()" style="width:100%">
        Login
    </button>

  

    <p id="loginMessage" style="color:#ef4444;margin-top:15px"></p>
</div>

</div>


<!-- ================= APLIKASI CUSTOMER ================= -->
<div id="app" class="hidden">

<header>
    <h1>GadgetStore Management System</h1>
    <p>Premium Technology Marketplace</p>
</header>

<div class="container">

    <div class="card">
        <div class="nav">
            <div>
                <h2>🛍️ Panel Pembeli</h2>
                <p>Selamat datang, <b id="welcome"></b></p>
            </div>

            <div class="user-info">
                <button class="admin-btn hidden" id="adminPanelBtn"
                    onclick="location.href='admin.html'">
                    ⚙️ Panel Admin
                </button>

                <button class="logout" onclick="logout()">
                    Keluar
                </button>
            </div>
        </div>
    </div>


    <!-- KATALOG -->
    <div class="card">
        <h2 class="section-title">📱 Katalog Produk</h2>

        <div id="products" class="products"></div>
    </div>


    <!-- PESANAN -->
    <div class="card">
        <h2 class="section-title">📦 Status Pesanan Saya</h2>

        <div id="orders"></div>
    </div>

</div>

<footer>
    © 2026 GadgetStore Pro — Prototype E-Commerce
</footer>

</div>


<script>

/* =====================================================
   DATA PRODUK DEFAULT
===================================================== */

const defaultProducts = [
{
    id:1,
    name:"Smartphone Premium",
    price:12000000,
    desc:"Layar AMOLED 120Hz, RAM 12GB, kamera 108MP dan baterai 5000mAh.",
    image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800",
    video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
},
{
    id:2,
    name:"Laptop Ultra",
    price:15500000,
    desc:"Laptop performa tinggi dengan RAM 16GB, SSD 1TB dan layar Full HD.",
    image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=800",
    video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
},
{
    id:3,
    name:"Gaming Headset",
    price:850000,
    desc:"Headset gaming surround sound dengan microphone noise cancelling.",
    image:"https://images.unsplash.com/photo-1599669454699-248893623440?w=800",
    video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
}
];


/* =====================================================
   INITIAL STORAGE
===================================================== */

if(!localStorage.getItem("products")){
    localStorage.setItem("products",JSON.stringify(defaultProducts));
}

if(!localStorage.getItem("orders")){
    localStorage.setItem("orders",JSON.stringify([]));
}


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(number){
    return new Intl.NumberFormat("id-ID",{
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(number);
}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const msg = document.getElementById("loginMessage");

    if(!username || !password){
        msg.textContent = "Username dan password wajib diisi!";
        return;
    }


    /* ADMIN */

    if(role === "admin"){

        if(username === "admin" && password === "12345"){

            localStorage.setItem("loggedUser","admin");
            localStorage.setItem("loggedRole","admin");

            location.href="admin.html";

        }else{
            msg.textContent="Username atau password admin salah!";
        }

        return;
    }


    /* CUSTOMER */

    let customers =
        JSON.parse(localStorage.getItem("customers") || "[]");

    let customer =
        customers.find(c => c.username === username);


    /* Jika belum ada, otomatis membuat akun */

    if(!customer){

        customer={
            username:username,
            password:password
        };

        customers.push(customer);

        localStorage.setItem(
            "customers",
            JSON.stringify(customers)
        );

    }else{

        if(customer.password !== password){
            msg.textContent="Password customer salah!";
            return;
        }

    }


    localStorage.setItem("loggedUser",username);
    localStorage.setItem("loggedRole","customer");

    showApp();
}


/* =====================================================
   TAMPILKAN APLIKASI
===================================================== */

function showApp(){

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    const user =
        localStorage.getItem("loggedUser");

    document.getElementById("welcome").textContent=user;

    if(localStorage.getItem("loggedRole")==="admin"){
        document.getElementById("adminPanelBtn")
            .classList.remove("hidden");
    }

    renderProducts();
    renderOrders();
}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem("loggedUser");
    localStorage.removeItem("loggedRole");

    location.reload();
}


/* =====================================================
   RENDER PRODUK
===================================================== */

function renderProducts(){

    const container =
        document.getElementById("products");

    const products =
        JSON.parse(localStorage.getItem("products") || "[]");

    if(products.length===0){

        container.innerHTML =
        `<div class="empty">
            Belum ada produk.
        </div>`;

        return;
    }


    container.innerHTML =
        products.map(product => `

        <div class="product">

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://via.placeholder.com/600x400?text=GadgetStore'"
            >

            <div class="product-body">

                <h3>${product.name}</h3>

                <div class="price">
                    ${rupiah(product.price)}
                </div>

                <p class="desc">
                    ${product.desc}
                </p>

                <video controls>
                    <source
                        src="${product.video}"
                        type="video/mp4">
                    Browser Anda tidak mendukung video.
                </video>

                <a
                    href="#"
                    class="btn buy"
                    onclick="buyProduct(${product.id});return false;">
                    🛒 Beli Sekarang
                </a>

            </div>
        </div>

    `).join("");
}


/* =====================================================
   BELI PRODUK
===================================================== */

function buyProduct(id){

    const user =
        localStorage.getItem("loggedUser");

    if(!user){
        alert("Silakan login terlebih dahulu!");
        return;
    }

    const products =
        JSON.parse(localStorage.getItem("products"));

    const product =
        products.find(p => p.id === id);

    if(!product)return;


    const orders =
        JSON.parse(localStorage.getItem("orders") || "[]");


    const order={
        id:Date.now(),
        customer:user,
        productId:product.id,
        productName:product.name,
        price:product.price,
        status:"Belum Dibayar",
        date:new Date().toLocaleString("id-ID")
    };


    orders.push(order);

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "Pesanan berhasil dibuat!\n\n" +
        product.name +
        "\n" +
        rupiah(product.price) +
        "\n\nStatus: Belum Dibayar"
    );

    renderOrders();
}


/* =====================================================
   RENDER PESANAN CUSTOMER
===================================================== */

function renderOrders(){

    const container =
        document.getElementById("orders");

    const user =
        localStorage.getItem("loggedUser");

    const orders =
        JSON.parse(localStorage.getItem("orders") || "[]");

    const myOrders =
        orders.filter(o => o.customer === user);


    if(myOrders.length===0){

        container.innerHTML=
        `<div class="empty">
            Belum ada pesanan.
        </div>`;

        return;
    }


    container.innerHTML =
        myOrders.map(order=>`

        <div class="order">

            <b>${order.productName}</b>

            <p>
                Harga:
                <b>${rupiah(order.price)}</b>
            </p>

            <p>
                Tanggal:
                ${order.date}
            </p>

            <span class="status">
                ${order.status}
            </span>

        </div>

    `).join("");
}


/* =====================================================
   CEK LOGIN SAAT HALAMAN DIBUKA
===================================================== */

if(
    localStorage.getItem("loggedUser") &&
    localStorage.getItem("loggedRole") === "customer"
){
    showApp();
}

</script>

</body>
</html>
