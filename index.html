<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Halaman Utama</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef8ff;
    color:#172033;
}

header{
    background:linear-gradient(
        135deg,
        #06182c,
        #075da8,
        #5ed5ff
    );

    color:white;
    padding:25px;
    text-align:center;

    box-shadow:0 5px 20px #0002;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:7px;
    opacity:.9;
}

.container{
    width:92%;
    max-width:1250px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;

    border:1px solid #d8edff;

    box-shadow:0 8px 25px #0878c522;
}

h2{
    color:#075da8;
    margin-bottom:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* ================= BUTTON ================= */

button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#0878d1;
    margin:3px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.success{
    background:#08a66a;
}

.admin-btn{
    background:#075da8;
}

/* ================= PRODUCT ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(270px,1fr));
    gap:20px;
}

.product{
    border:1px solid #d9ecfa;
    border-radius:15px;
    overflow:hidden;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.product-body{
    padding:16px;
    flex:1;
    display:flex;
    flex-direction:column;
}

.product-body h3{
    margin-bottom:7px;
}

.price{
    color:#0878d1;
    font-size:20px;
    font-weight:bold;
    margin:8px 0 4px;
}

.stock-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
    background:#e0f2fe;
    color:#0369a1;
}

.stock-badge.out-of-stock{
    background:#fee2e2;
    color:#b91c1c;
}

.product-desc{
    color:#64748b;
    line-height:1.5;
    margin-bottom:12px;
}

.product video{
    width:100%;
    margin-top:auto;
    border-radius:8px;
    background:#000;
}

.buy-btn{
    width:100%;
    margin-top:15px;
}

.buy-btn:disabled{
    background:#cbd5e1;
    cursor:not-allowed;
    transform:none;
}

/* ================= MODAL PESAN ================= */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:18px;
    width:90%;
    max-width:450px;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    margin:8px 0 15px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}

</style>

</head>


<body>

<header>
    <h1>GadgetStore Pro</h1>
    <p>Toko Gadget Impian Anda</p>
</header>

<div class="container">

    <!-- NAVIGASI KE ADMIN -->
    <div class="card">
        <div class="topbar">
            <h2>🛍️ Katalog Produk</h2>
            <button class="admin-btn" onclick="location.href='admin.html'">
                ⚙️ Halaman Admin
            </button>
        </div>
    </div>

    <!-- KATALOG PRODUK -->
    <div class="card">
        <div id="productList" class="product-grid"></div>
    </div>

</div>

<!-- MODAL FORM PEMBELIAN -->
<div id="buyModal" class="modal">
    <div class="modal-content">
        <h2>🛍️ Beli Produk</h2>
        <form id="orderForm">
            <input type="hidden" id="orderProductId">
            <input type="hidden" id="orderProductName">
            <input type="hidden" id="orderProductPrice">

            <p><b id="displayProductName"></b></p>
            <p id="displayProductPrice" style="color:#0878d1; font-weight:bold; margin-bottom:10px;"></p>

            <label>Nama Anda</label>
            <input type="text" id="customerName" placeholder="Masukkan nama lengkap" required>

            <label>Jumlah</label>
            <input type="number" id="orderQty" value="1" min="1" required>

            <label>Metode Pembayaran</label>
            <select id="paymentMethod">
                <option value="Transfer Bank">Transfer Bank</option>
                <option value="E-Wallet (OVO/Gopay/Dana)">E-Wallet (OVO/Gopay/Dana)</option>
                <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
            </select>

            <button type="submit" class="success">Kirim Pesanan</button>
            <button type="button" class="admin-btn" style="background:#64748b;" onclick="closeModal()">Batal</button>
        </form>
    </div>
</div>

<footer>
    © 2026 GadgetStore Pro
</footer>

<script>

/* =====================================================
INDEXEDDB UTILITIES (DAPATKAN DATA PRODUK DARI ADMIN)
===================================================== */

const DB_NAME = "GadgetStoreDB";
const DB_VERSION = 1;
const STORE_NAME = "products";

const INITIAL_PRODUCTS = [
    {
        id: 101,
        name: "Smartphone Galaxy Ultra",
        price: 12000000,
        stock: 15,
        desc: "Smartphone flagship dengan kamera 200MP dan performa tinggi.",
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
        video: ""
    },
    {
        id: 102,
        name: "Laptop Pro Book 15",
        price: 15500000,
        stock: 8,
        desc: "Laptop profesional untuk kebutuhan koding dan desain grafis.",
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
        video: ""
    }
];

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                const store = db.createObjectStore(STORE_NAME, { keyPath: "id" });
                INITIAL_PRODUCTS.forEach(product => store.add(product));
            }
        };

        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject("Gagal membuka database lokal: " + e.target.error);
    });
}

async function getAllProductsFromDB() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();

        req.onsuccess = async () => {
            let products = req.result || [];
            if (products.length === 0) {
                for (const item of INITIAL_PRODUCTS) {
                    await saveProductToDB(item);
                }
                products = INITIAL_PRODUCTS;
            }
            resolve(products);
        };

        req.onerror = () => reject(req.error);
    });
}

async function saveProductToDB(product) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(product);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function rupiah(number){
    return new Intl.NumberFormat("id-ID", {
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(number);
}

/* =====================================================
RENDER PRODUK KE PEMBELI
===================================================== */

async function renderCustomerProducts(){
    const container = document.getElementById("productList");
    const products = await getAllProductsFromDB();

    if(products.length === 0){
        container.innerHTML = `<div class="empty">📦 Belum ada produk yang tersedia.</div>`;
        return;
    }

    container.innerHTML = "";

    products.forEach(product => {
        let imageSrc = 'https://via.placeholder.com/600x400?text=No+Image';
        if (product.image instanceof File || product.image instanceof Blob) {
            imageSrc = URL.createObjectURL(product.image);
        } else if (typeof product.image === 'string' && product.image.trim() !== '') {
            imageSrc = product.image;
        }

        let videoSrc = '';
        if (product.video instanceof File || product.video instanceof Blob) {
            videoSrc = URL.createObjectURL(product.video);
        } else if (typeof product.video === 'string') {
            videoSrc = product.video;
        }

        const productEl = document.createElement("div");
        productEl.className = "product";

        productEl.innerHTML = `
            <img src="${imageSrc}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
            <div class="product-body">
                <h3>${product.name}</h3>
                <div class="price">${rupiah(product.price)}</div>
                <div class="stock-badge ${product.stock <= 0 ? 'out-of-stock' : ''}">
                    ${product.stock > 0 ? 'Stok: ' + product.stock : 'Stok Habis'}
                </div>
                <p class="product-desc">${product.desc}</p>
                ${videoSrc ? `
                <video controls>
                    <source src="${videoSrc}">
                    Browser tidak mendukung video.
                </video>
                ` : ''}
                <button 
                    class="success buy-btn" 
                    ${product.stock <= 0 ? 'disabled' : ''} 
                    onclick="openBuyModal(${product.id}, '${product.name.replace(/'/g, "\\'")}', ${product.price})">
                    ${product.stock > 0 ? '🛒 Beli Sekarang' : 'Stok Habis'}
                </button>
            </div>
        `;

        container.appendChild(productEl);
    });
}

/* =====================================================
SISTEM PEMESANAN (TERKONEKSI DENGAN ADMIN)
===================================================== */

function openBuyModal(id, name, price) {
    document.getElementById("orderProductId").value = id;
    document.getElementById("orderProductName").value = name;
    document.getElementById("orderProductPrice").value = price;

    document.getElementById("displayProductName").textContent = name;
    document.getElementById("displayProductPrice").textContent = rupiah(price);

    document.getElementById("buyModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("buyModal").style.display = "none";
    document.getElementById("orderForm").reset();
}

document.getElementById("orderForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const productId = Number(document.getElementById("orderProductId").value);
    const productName = document.getElementById("orderProductName").value;
    const price = Number(document.getElementById("orderProductPrice").value);
    const customer = document.getElementById("customerName").value.trim();
    const qty = Number(document.getElementById("orderQty").value);
    const payment = document.getElementById("paymentMethod").value;

    const products = await getAllProductsFromDB();
    const product = products.find(p => p.id === productId);

    if (!product || product.stock < qty) {
        alert("Stok tidak mencukupi!");
        return;
    }

    // 1. Kurangi stok produk
    product.stock -= qty;
    await saveProductToDB(product);

    // 2. Simpan data pesanan ke localStorage agar dibaca oleh Admin
    const orders = JSON.parse(localStorage.getItem("orders") || "[]");
    const newOrder = {
        id: Date.now(),
        productId: productId,
        productName: productName,
        customer: customer,
        quantity: qty,
        price: price,
        total: price * qty,
        payment: payment,
        status: "Belum Dibayar",
        date: new Date().toLocaleDateString("id-ID", {
            day: 'numeric', month: 'long', year: 'numeric'
        })
    };

    orders.push(newOrder);
    localStorage.setItem("orders", JSON.stringify(orders));

    alert("Pesanan berhasil dikirim ke Admin!");
    closeModal();
    renderCustomerProducts();
});

renderCustomerProducts();

</script>

</body>
</html>
