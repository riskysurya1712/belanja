<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetStore Pro - Halaman Utama</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef8ff;
    color:#172033;
}

header{
    background:linear-gradient(
        135deg,
        #06182c,
        #075da8,
        #5ed5ff
    );

    color:white;
    padding:25px;
    text-align:center;
    position:relative;
    box-shadow:0 5px 20px #0002;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:7px;
    opacity:.9;
}

.user-bar {
    position: absolute;
    top: 15px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
}

.container{
    width:92%;
    max-width:1250px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;

    border:1px solid #d8edff;

    box-shadow:0 8px 25px #0878c522;
}

h2{
    color:#075da8;
    margin-bottom:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* ================= BUTTON ================= */

button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:#0878d1;
    margin:3px;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.success{
    background:#08a66a;
}

.admin-btn{
    background:#075da8;
}

.logout-btn{
    background:#ef4444;
    padding:6px 12px;
    font-size:12px;
}

/* ================= PRODUCT ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(270px,1fr));
    gap:20px;
}

.product{
    border:1px solid #d9ecfa;
    border-radius:15px;
    overflow:hidden;
    background:white;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.product img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.product-body{
    padding:16px;
    flex:1;
    display:flex;
    flex-direction:column;
}

.product-body h3{
    margin-bottom:7px;
}

.price{
    color:#0878d1;
    font-size:20px;
    font-weight:bold;
    margin:8px 0 4px;
}

.stock-badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
    background:#e0f2fe;
    color:#0369a1;
}

.stock-badge.out-of-stock{
    background:#fee2e2;
    color:#b91c1c;
}

.product-desc{
    color:#64748b;
    line-height:1.5;
    margin-bottom:12px;
}

.product video{
    width:100%;
    margin-top:auto;
    border-radius:8px;
    background:#000;
}

.buy-btn{
    width:100%;
    margin-top:15px;
}

.buy-btn:disabled{
    background:#cbd5e1;
    cursor:not-allowed;
    transform:none;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    align-items:center;
    justify-content:center;
    z-index:999;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:18px;
    width:90%;
    max-width:450px;
}

.auth-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.auth-tabs button {
    flex: 1;
    background: #e2e8f0;
    color: #475569;
}

.auth-tabs button.active {
    background: #0878d1;
    color: white;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    margin:8px 0 15px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}

</style>

</head>


<body>

<header>
    <h1>GadgetStore Pro</h1>
    <p>Toko Gadget Impian Anda</p>
    
    <!-- BAR STATUS USER -->
    <div class="user-bar">
        <div id="userInfo" style="display: none;">
            <span id="userNameDisplay" class="user-badge"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <button id="loginNavBtn" onclick="openAuthModal()">🔑 Login / Daftar</button>
    </div>
</header>

<div class="container">

    <!-- NAVIGASI KE ADMIN (HANYA MUNCUL BILA ADMIN LOGIN) -->
    <div class="card">
        <div class="topbar">
            <h2>🛍️ Katalog Produk</h2>
            <button id="adminPageBtn" class="admin-btn" style="display: none;" onclick="location.href='admin.html'">
                ⚙️ Halaman Admin
            </button>
        </div>
    </div>

    <!-- KATALOG PRODUK -->
    <div class="card">
        <div id="productList" class="product-grid"></div>
    </div>

</div>

<!-- MODAL AUTHENTICATION (LOGIN & DAFTAR) -->
<div id="authModal" class="modal">
    <div class="modal-content">
        <div class="auth-tabs">
            <button id="tabLoginBtn" class="active" onclick="switchAuthTab('login')">Login</button>
            <button id="tabRegisterBtn" onclick="switchAuthTab('register')">Daftar Akun</button>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm">
            <h2>🔑 Login User / Admin</h2>
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Masukkan username" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan password" required>

            <button type="submit" class="success" style="width: 100%;">Masuk</button>
            <button type="button" class="admin-btn" style="background:#64748b; width: 100%;" onclick="closeAuthModal()">Batal</button>
        </form>

        <!-- FORM REGISTRASI CUSTOMER -->
        <form id="registerForm" style="display: none;">
            <h2>📝 Registrasi Customer</h2>
            <label>Username Bebas</label>
            <input type="text" id="regUsername" placeholder="Buat username Anda" required>

            <label>Password Bebas</label>
            <input type="password" id="regPassword" placeholder="Buat password Anda" required>

            <button type="submit" class="success" style="width: 100%;">Daftar & Login</button>
            <button type="button" class="admin-btn" style="background:#64748b; width: 100%;" onclick="closeAuthModal()">Batal</button>
        </form>
    </div>
</div>

<!-- MODAL FORM PEMBELIAN -->
<div id="buyModal" class="modal">
    <div class="modal-content">
        <h2>🛍️ Beli Produk</h2>
        <form id="orderForm">
            <input type="hidden" id="orderProductId">
            <input type="hidden" id="orderProductName">
            <input type="hidden" id="orderProductPrice">

            <p><b id="displayProductName"></b></p>
            <p id="displayProductPrice" style="color:#0878d1; font-weight:bold; margin-bottom:10px;"></p>

            <label>Nama Anda</label>
            <input type="text" id="customerName" placeholder="Masukkan nama lengkap" required>

            <label>Jumlah</label>
            <input type="number" id="orderQty" value="1" min="1" required>

            <label>Metode Pembayaran</label>
            <select id="paymentMethod">
                <option value="Transfer Bank">Transfer Bank</option>
                <option value="E-Wallet (OVO/Gopay/Dana)">E-Wallet (OVO/Gopay/Dana)</option>
                <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
            </select>

            <button type="submit" class="success">Kirim Pesanan</button>
            <button type="button" class="admin-btn" style="background:#64748b;" onclick="closeModal()">Batal</button>
        </form>
    </div>
</div>

<footer>
    © 2026 GadgetStore Pro
</footer>

<script>

/* =====================================================
SISTEM OTENTIKASI & USER MANAGEMENT
===================================================== */

let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");

function checkAuthStatus() {
    const userInfo = document.getElementById("userInfo");
    const loginNavBtn = document.getElementById("loginNavBtn");
    const userNameDisplay = document.getElementById("userNameDisplay");
    const adminPageBtn = document.getElementById("adminPageBtn");

    if (currentUser) {
        userInfo.style.display = "flex";
        loginNavBtn.style.display = "none";
        userNameDisplay.textContent = `👤 ${currentUser.username} (${currentUser.role})`;
        
        // Hanya tampilkan tombol Admin jika login sebagai admin
        if (currentUser.role === "admin") {
            adminPageBtn.style.display = "inline-block";
        } else {
            adminPageBtn.style.display = "none";
        }
    } else {
        userInfo.style.display = "none";
        loginNavBtn.style.display = "inline-block";
        adminPageBtn.style.display = "none";
    }
}

function openAuthModal() {
    document.getElementById("authModal").style.display = "flex";
}

function closeAuthModal() {
    document.getElementById("authModal").style.display = "none";
    document.getElementById("loginForm").reset();
    document.getElementById("registerForm").reset();
}

function switchAuthTab(tab) {
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const tabLoginBtn = document.getElementById("tabLoginBtn");
    const tabRegisterBtn = document.getElementById("tabRegisterBtn");

    if (tab === "login") {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
        tabLoginBtn.classList.add("active");
        tabRegisterBtn.classList.remove("active");
    } else {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
        tabLoginBtn.classList.remove("active");
        tabRegisterBtn.classList.add("active");
    }
}

// Handler Submit Form Login
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const usernameInput = document.getElementById("loginUsername").value.trim();
    const passwordInput = document.getElementById("loginPassword").value.trim();

    // 1. Cek Kredensial Admin
    if (usernameInput === "admin" && passwordInput === "12345") {
        currentUser = { username: "admin", role: "admin" };
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
        alert("Login berhasil sebagai Admin!");
        closeAuthModal();
        checkAuthStatus();
        return;
    }

    // 2. Cek Kredensial Customer dari LocalStorage
    const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
    const foundUser = users.find(u => u.username === usernameInput && u.password === passwordInput);

    if (foundUser) {
        currentUser = { username: foundUser.username, role: "customer" };
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
        alert(`Selamat datang kembali, ${foundUser.username}!`);
        closeAuthModal();
        checkAuthStatus();
    } else {
        alert("Username atau Password salah! (Atau daftar akun terlebih dahulu)");
    }
});

// Handler Submit Form Registrasi
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const regUsername = document.getElementById("regUsername").value.trim();
    const regPassword = document.getElementById("regPassword").value.trim();

    if (regUsername.toLowerCase() === "admin") {
        alert("Username 'admin' telah dicadangkan. Silakan gunakan username lain.");
        return;
    }

    const users = JSON.parse(localStorage.getItem("registeredUsers") || "[]");
    const isExist = users.some(u => u.username === regUsername);

    if (isExist) {
        alert("Username telah digunakan! Silakan pilih username lain.");
        return;
    }

    // Simpan User Baru
    users.push({ username: regUsername, password: regPassword });
    localStorage.setItem("registeredUsers", JSON.stringify(users));

    // Auto Login
    currentUser = { username: regUsername, role: "customer" };
    localStorage.setItem("currentUser", JSON.stringify(currentUser));

    alert("Pendaftaran berhasil! Anda telah otomatis login.");
    closeAuthModal();
    checkAuthStatus();
});

function logout() {
    localStorage.removeItem("currentUser");
    currentUser = null;
    alert("Anda telah logout.");
    checkAuthStatus();
}

/* =====================================================
INDEXEDDB UTILITIES (DAPATKAN DATA PRODUK DARI ADMIN)
===================================================== */

const DB_NAME = "GadgetStoreDB";
const DB_VERSION = 1;
const STORE_NAME = "products";

const INITIAL_PRODUCTS = [
    {
        id: 101,
        name: "Smartphone Galaxy Ultra",
        price: 12000000,
        stock: 15,
        desc: "Smartphone flagship dengan kamera 200MP dan performa tinggi.",
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",
        video: ""
    },
    {
        id: 102,
        name: "Laptop Pro Book 15",
        price: 15500000,
        stock: 8,
        desc: "Laptop profesional untuk kebutuhan koding dan desain grafis.",
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500",
        video: ""
    }
];

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                const store = db.createObjectStore(STORE_NAME, { keyPath: "id" });
                INITIAL_PRODUCTS.forEach(product => store.add(product));
            }
        };

        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject("Gagal membuka database lokal: " + e.target.error);
    });
}

async function getAllProductsFromDB() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();

        req.onsuccess = async () => {
            let products = req.result || [];
            if (products.length === 0) {
                for (const item of INITIAL_PRODUCTS) {
                    await saveProductToDB(item);
                }
                products = INITIAL_PRODUCTS;
            }
            resolve(products);
        };

        req.onerror = () => reject(req.error);
    });
}

async function saveProductToDB(product) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(product);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function rupiah(number){
    return new Intl.NumberFormat("id-ID", {
        style:"currency",
        currency:"IDR",
        maximumFractionDigits:0
    }).format(number);
}

/* =====================================================
RENDER PRODUK KE PEMBELI
===================================================== */

async function renderCustomerProducts(){
    const container = document.getElementById("productList");
    const products = await getAllProductsFromDB();

    if(products.length === 0){
        container.innerHTML = `<div class="empty">📦 Belum ada produk yang tersedia.</div>`;
        return;
    }

    container.innerHTML = "";

    products.forEach(product => {
        let imageSrc = 'https://via.placeholder.com/600x400?text=No+Image';
        if (product.image instanceof File || product.image instanceof Blob) {
            imageSrc = URL.createObjectURL(product.image);
        } else if (typeof product.image === 'string' && product.image.trim() !== '') {
            imageSrc = product.image;
        }

        let videoSrc = '';
        if (product.video instanceof File || product.video instanceof Blob) {
            videoSrc = URL.createObjectURL(product.video);
        } else if (typeof product.video === 'string') {
            videoSrc = product.video;
        }

        const productEl = document.createElement("div");
        productEl.className = "product";

        productEl.innerHTML = `
            <img src="${imageSrc}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
            <div class="product-body">
                <h3>${product.name}</h3>
                <div class="price">${rupiah(product.price)}</div>
                <div class="stock-badge ${product.stock <= 0 ? 'out-of-stock' : ''}">
                    ${product.stock > 0 ? 'Stok: ' + product.stock : 'Stok Habis'}
                </div>
                <p class="product-desc">${product.desc}</p>
                ${videoSrc ? `
                <video controls>
                    <source src="${videoSrc}">
                    Browser tidak mendukung video.
                </video>
                ` : ''}
                <button 
                    class="success buy-btn" 
                    ${product.stock <= 0 ? 'disabled' : ''} 
                    onclick="openBuyModal(${product.id}, '${product.name.replace(/'/g, "\\'")}', ${product.price})">
                    ${product.stock > 0 ? '🛒 Beli Sekarang' : 'Stok Habis'}
                </button>
            </div>
        `;

        container.appendChild(productEl);
    });
}

/* =====================================================
SISTEM PEMESANAN (TERKONEKSI DENGAN ADMIN)
===================================================== */

function openBuyModal(id, name, price) {
    if (!currentUser) {
        alert("Silakan login terlebih dahulu sebelum membeli!");
        openAuthModal();
        return;
    }

    document.getElementById("orderProductId").value = id;
    document.getElementById("orderProductName").value = name;
    document.getElementById("orderProductPrice").value = price;

    document.getElementById("displayProductName").textContent = name;
    document.getElementById("displayProductPrice").textContent = rupiah(price);
    
    // Otomatis isikan nama akun jika login sebagai customer
    if (currentUser) {
        document.getElementById("customerName").value = currentUser.username;
    }

    document.getElementById("buyModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("buyModal").style.display = "none";
    document.getElementById("orderForm").reset();
}

document.getElementById("orderForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const productId = Number(document.getElementById("orderProductId").value);
    const productName = document.getElementById("orderProductName").value;
    const price = Number(document.getElementById("orderProductPrice").value);
    const customer = document.getElementById("customerName").value.trim();
    const qty = Number(document.getElementById("orderQty").value);
    const payment = document.getElementById("paymentMethod").value;

    const products = await getAllProductsFromDB();
    const product = products.find(p => p.id === productId);

    if (!product || product.stock < qty) {
        alert("Stok tidak mencukupi!");
        return;
    }

    // 1. Kurangi stok produk
    product.stock -= qty;
    await saveProductToDB(product);

    // 2. Simpan data pesanan ke localStorage agar dibaca oleh Admin
    const orders = JSON.parse(localStorage.getItem("orders") || "[]");
    const newOrder = {
        id: Date.now(),
        productId: productId,
        productName: productName,
        customer: customer,
        quantity: qty,
        price: price,
        total: price * qty,
        payment: payment,
        status: "Belum Dibayar",
        date: new Date().toLocaleDateString("id-ID", {
            day: 'numeric', month: 'long', year: 'numeric'
        })
    };

    orders.push(newOrder);
    localStorage.setItem("orders", JSON.stringify(orders));

    alert("Pesanan berhasil dikirim ke Admin!");
    closeModal();
    renderCustomerProducts();
});

// Inisialisasi awal
checkAuthStatus();
renderCustomerProducts();

</script>

</body>
</html>
